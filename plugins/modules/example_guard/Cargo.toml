[package]
name = "example_guard"
version = "0.1.0"
edition = "2021"
description = "Example qm-rs plugin: a deployment's own screener plus cheap-model routing."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
qm_plugin_sdk = { path = "../../qm_plugin_sdk" }

[profile.release]
opt-level = "z"
lto = true
strip = true
